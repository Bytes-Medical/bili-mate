  # ---- Exchange transfusion and encephalopathy --------------------------
  - id: S052
    title: Acute bilirubin encephalopathy is an emergency below every numeric line
    category: exchange-and-encephalopathy
    refs: ["1.5.1", "1.9.2"]
    input:
      gestation: 38
      age: 2880
      features: { acute_bilirubin_encephalopathy: present }
