    expect:
      primary: ACUTE_BILIRUBIN_ENCEPHALOPATHY_EMERGENCY
      active: [EXCHANGE_TRANSFUSION_ESCALATION, INCREASED_KERNICTERUS_RISK, EXCHANGE_TRANSFUSION_INFORMATION]
      suppressed: [NO_ROUTINE_REPEAT]
      photo_relation: below
  - id: S053
    title: Serum 341 at 37 or more weeks raises kernicterus risk (strictly over 340)
    category: exchange-and-encephalopathy
    refs: ["1.5.1"]
    input:
      gestation: 38
      age: 5760
      measurements: [{ age: 5760, value: 341, method: serum }]
    expect:
      primary: INCREASED_KERNICTERUS_RISK
      suppressed: [RETEST_WITHIN_24H]
      photo_relation: below
  - id: S054
    title: The 340 kernicterus threshold does not apply below 37 weeks
    category: exchange-and-encephalopathy
    description: At 36 weeks, 341 is within 50 of the exchange plateau (360) after 72 hours, so intensified phototherapy is considered; the 340 rule itself stays inactive below 37 weeks.
    refs: ["1.5.1", "1.4.9"]
    input:
      gestation: 36
      age: 10000
      measurements: [{ age: 10000, value: 341, method: serum }]
    expect:
      primary: CONSIDER_INTENSIFIED_PHOTOTHERAPY
      active: [START_PHOTOTHERAPY]
      inactive: [INCREASED_KERNICTERUS_RISK]
      photo_relation: above
      exchange_relation: below
  - id: S055
