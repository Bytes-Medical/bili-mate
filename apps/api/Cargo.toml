[package]
name = "bili-mate-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Axum HTTP service implementing the Bili Mate OpenAPI 3.1 contract (spec 04)."

[dependencies]
axum = "0.8.9"
clinical-core = { path = "../../crates/clinical-core" }
guideline-data = { path = "../../crates/guideline-data" }
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_jcs = "0.2.0"
serde_json.workspace = true
serde_path_to_error = "0.1.20"
sha2.workspace = true
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1.4"
jsonschema = "0.49.2"
serde_yaml.workspace = true
tower = { version = "0.5.3", features = ["util"] }
