[workspace]
resolver = "2"
members = [
    "crates/clinical-core",
    "crates/guideline-data",
    "apps/api",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
proptest = "1"
