name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  spec:
    name: Specification validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby spec/validate.rb

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  clients:
    name: Generated API clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate TypeScript client
        run: |
          docker run --rm -v "$PWD":/local openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/spec/openapi.yaml -g typescript-fetch \
            -o /local/clients/generated/typescript \
            --additional-properties=supportsES6=true,npmName=bili-mate-client
      - name: Generate Swift client
        run: |
          docker run --rm -v "$PWD":/local openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/spec/openapi.yaml -g swift5 \
            -o /local/clients/generated/swift
      - name: Generate Kotlin client
        run: |
          docker run --rm -v "$PWD":/local openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/spec/openapi.yaml -g kotlin \
            -o /local/clients/generated/kotlin
      - name: Compile TypeScript consumer fixture
        run: |
          sudo chown -R "$(id -u):$(id -g)" clients/generated
          npm install --no-save typescript@5
          npx tsc -p clients/typescript-fixture/tsconfig.json
