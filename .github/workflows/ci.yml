name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  spec:
    name: Specification validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby spec/validate.rb

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Reference web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Verify the committed API schema matches the contract
        run: |
          npm run generate:api
          git diff --exit-code lib/api/schema.d.ts
        working-directory: web
      - name: Build static export with CSP hashes
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:18099
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - name: Browser end-to-end tests (three engines, TEST-023)
        run: npx playwright test
        working-directory: web

  infrastructure:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
        working-directory: infrastructure
      - run: terraform init -backend=false
        working-directory: infrastructure
      - run: terraform validate
        working-directory: infrastructure

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the hardened image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bili-mate-api:ci
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            VERSION=ci

  clients:
    name: Generated API clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate TypeScript client
        run: |
          docker run --rm -v "$PWD":/local openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/spec/openapi.yaml -g typescript-fetch \
            -o /local/clients/generated/typescript \
            --additional-properties=supportsES6=true,npmName=bili-mate-client
      - name: Generate Swift client
        run: |
          docker run --rm -v "$PWD":/local openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/spec/openapi.yaml -g swift5 \
            -o /local/clients/generated/swift
      - name: Generate Kotlin client
        run: |
          docker run --rm -v "$PWD":/local openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/spec/openapi.yaml -g kotlin \
            -o /local/clients/generated/kotlin
      - name: Compile TypeScript consumer fixture
        run: |
          sudo chown -R "$(id -u):$(id -g)" clients/generated
          npm install --no-save typescript@5
          npx tsc -p clients/typescript-fixture/tsconfig.json
