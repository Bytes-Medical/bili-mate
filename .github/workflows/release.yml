# Release pipeline (spec 10 deployment process, steps 1–5; SEC-012,
# TEST-029). Builds the container from an exact tagged commit, generates the
# SBOM and provenance, scans, signs, and records the release manifest.
# Deployment itself (canary steps 6–10) is an operator Terraform action
# gated on environment approvals — this pipeline produces the verified
# artifact and the evidence, it never touches production by itself.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing

jobs:
  verify:
    name: Verify the exact commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby spec/validate.rb
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  image:
    name: Build, scan and sign the image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/bili-mate-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Vulnerability scan (release-blocking, TEST-027)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Generate SBOM artifact
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          artifact-name: sbom-bili-mate-api.spdx.json
      - name: Sign the image (keyless)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Record the release manifest
        run: |
          RULE_PACK_SHA=$(shasum -a 256 spec/clinical/nice-cg98-2023-10-31.1.yaml | cut -d' ' -f1)
          cat > release-manifest.json <<EOF
          {
            "tag": "${{ github.ref_name }}",
            "source_commit": "${{ github.sha }}",
            "image": "${IMAGE}@${{ steps.build.outputs.digest }}",
            "rule_pack_id": "nice-cg98-2023-10-31.1",
            "rule_pack_sha256": "${RULE_PACK_SHA}",
            "engine_version": "0.1.0",
            "api_version": "1.0.0-draft"
          }
          EOF
          cat release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  # Canary deployment gate: the environment requires a recorded reviewer
  # approval (spec 10 steps 6–10 run via Terraform per the runbook). This
  # job only verifies the artifact chain end-to-end before a human deploys.
  canary-gate:
    name: Canary approval gate
    needs: image
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - name: Approved for canary
        run: |
          echo "Release manifest approved for canary deployment:"
          cat release-manifest.json
          echo "Deploy via infrastructure/ (RUNBOOK.md canary procedure)."
